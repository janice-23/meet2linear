<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>meet2linear — review</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e2230; --border: #2a2f3d;
      --text: #e6e9f0; --muted: #8b93a7; --accent: #5e6ad2;
      --bug: #e5534b; --feature: #57ab5a; --other: #8b93a7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; }
    header .sub { color: var(--muted); font-size: 12px; flex: 1; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 57px); }
    #meetings { border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
    .meeting { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; position: relative; }
    .meeting:hover { background: var(--panel); }
    .meeting.active { background: var(--panel2); border-color: var(--border); }
    .meeting .title { font-weight: 600; padding-right: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meeting .info { color: var(--muted); font-size: 12px; }
    .meeting .del { position: absolute; top: 8px; right: 8px; color: var(--muted); cursor: pointer; display: none; background: none; border: none; padding: 0 4px; font-size: 14px; }
    .meeting:hover .del { display: block; }
    .meeting .del:hover { color: var(--bug); }
    #detail { padding: 20px; overflow-y: auto; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .toolbar h2 { font-size: 15px; margin: 0; flex: 1; }
    .state { font-size: 12px; color: var(--muted); }
    .state.error { color: var(--bug); }
    button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .card.discarded { opacity: 0.45; }
    .card .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge.bug { background: color-mix(in srgb, var(--bug) 20%, transparent); color: var(--bug); }
    .badge.feature_request { background: color-mix(in srgb, var(--feature) 20%, transparent); color: var(--feature); }
    .badge.other { background: color-mix(in srgb, var(--other) 20%, transparent); color: var(--other); }
    .conf { font-size: 12px; color: var(--muted); }
    input.title { flex: 1; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); font-size: 14px; font-weight: 600; padding: 4px 8px; }
    textarea.desc { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; padding: 8px; min-height: 70px; resize: vertical; }
    input.title:focus, textarea.desc:focus { outline: none; border-color: var(--accent); background: var(--panel2); }
    .evidence { margin: 10px 0 4px; padding-left: 10px; border-left: 3px solid var(--border); }
    .evidence .quote { margin: 4px 0; color: var(--muted); font-size: 13px; }
    .evidence .quote b { color: var(--text); }
    .evidence .quote .unverified { color: var(--bug); font-size: 11px; margin-left: 6px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .actions .link { color: var(--accent); font-size: 13px; text-decoration: none; }
    details.lowconf > summary { cursor: pointer; color: var(--muted); margin: 18px 0 10px; }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    #toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: none; max-width: 380px; z-index: 10; }
    #toast.error { border-color: var(--bug); }
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; min-width: 440px; }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog h3 { margin: 0 0 14px; font-size: 15px; }
    dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    dialog input, dialog select { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; font: inherit; }
    dialog .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    dialog .hint a { color: var(--accent); }
    dialog .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .teamrow { display: flex; gap: 8px; }
    .teamrow select { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1>meet2linear</h1>
    <span class="sub">review proposed tickets before they hit Linear</span>
    <button id="load-sample">Load sample call</button>
    <button id="open-settings">⚙ Settings</button>
  </header>
  <main>
    <nav id="meetings"></nav>
    <section id="detail"><div class="empty">Select a meeting</div></section>
  </main>

  <dialog id="settings">
    <h3>Settings</h3>
    <label for="gemini-key">Gemini API key</label>
    <input id="gemini-key" type="password" autocomplete="off" />
    <div class="hint">Free key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>. Used for transcript → ticket extraction.</div>
    <label for="linear-key">Linear API key</label>
    <input id="linear-key" type="password" autocomplete="off" />
    <div class="hint">Linear → Settings → Security &amp; Access → personal API keys. Free plan works.</div>
    <label for="team-select">Linear team</label>
    <div class="teamrow">
      <select id="team-select"><option value="">— load teams first —</option></select>
      <button id="load-teams">Load teams</button>
    </div>
    <div class="hint">Issues are created in this team with a <code>from-meet</code> label.</div>
    <div class="dialog-actions">
      <button id="close-settings">Close</button>
      <button id="save-settings" class="primary">Save</button>
    </div>
  </dialog>

  <div id="toast"></div>
  <script type="module" src="review.js"></script>
</body>
</html>
